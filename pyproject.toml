[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daoyuan-knowledge-base"
version = "1.0.0rc4"
description = "Windows local knowledge base and reader for authorized public-account articles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "liuyinchen1983" }]
dependencies = ["PySide6==6.12.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["PyInstaller==6.22.3", "Pillow>=10"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# 该文件只描述源码包元数据。程序实际以 scripts/ 启动或由 PyInstaller
# 打包，不要求 pip install 后才能运行。
